# Cloudflare Pages configuration for Jivan Medicine
# Deploy: npm run pages:build && npm run pages:deploy
#
# Environment variables should be set in the Cloudflare dashboard:
# Pages > Settings > Environment Variables
# Required: DATABASE_URL, ADMIN_PANEL_PASSWORD, ADMIN_SESSION_SECRET

name = "jivan-medicine"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set these in Cloudflare dashboard, NOT here (secrets)
